[project]
name = "liesel_ptm"
dynamic = ["version"]
description = "Bayesian Penalized Transformation Models in Liesel"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Johannes Brachem" },
]
dependencies = [
    "liesel>=0.6.0.dev0",
    "liesel-gam>=0.2.4",
    "jax>=0.8.0",
    "numpy>=2.0",
    "pandas>=2.2.3",
    "plotnine>=0.15.0",
    "interpax>=0.3.14",
    "tfp-nightly>=0.26.0.dev20250811",
]

[tool.uv.sources]
liesel = { git = "https://github.com/liesel-devs/liesel.git", branch = "vi-modernization" }

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "nbval>=0.11.0",
    "optax>=0.2.5",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.11.4",
    "sphinx>=8.2.3",
    "sphinx-autodoc-typehints>=3.2.0",
    "sphinx-book-theme>=1.1.4",
    "sphinx-copybutton>=0.5.2",
]

[tool.pytest.ini_options]
testpaths = "tests"
# turn warnings into errors and filter out specific warnings
filterwarnings = [
    "error",
    "ignore::FutureWarning:arviz",
    "ignore:jax.interpreters.xla.pytype_aval_mappings is deprecated:DeprecationWarning:tensorflow_probability.python.internal.backend.jax.ops",
    "ignore:jax.core.pytype_aval_mappings is deprecated.:DeprecationWarning:tensorflow_probability.python.internal.backend.jax.ops",
    "ignore:shape requires ndarray or scalar arguments, got <class 'NoneType'> at position 0. In a future JAX release this will be an error.:DeprecationWarning:tensorflow_probability.python.internal.backend.jax.random_generators",
    "ignore:.*interactive_bk attribute was deprecated in Matplotlib 3.9.*:matplotlib._api.deprecation.MatplotlibDeprecationWarning",
    # plotnine uses pandas' deprecated reset_index(inplace=...) argument.
    'ignore:The inplace keyword in DataFrame\.reset_index is deprecated:DeprecationWarning:plotnine',

    # Caused by the use in blackjax
    "ignore:JAXopt is no longer maintained:DeprecationWarning",
]

[tool.ruff.lint]
select = [
    "F",  # pyflakes (flake8 core)
    "E",  # pycodestyle errors (flake8)
    "W",  # pycodestyle warnings (flake8)
    "I",  # isort (import sorting)
    "UP", # pyupgrade (modern syntax)
    "B004",   # reliable callable checks
    "B015",   # catch pointless comparisons in tests
    "C408",   # unnecessary dict calls
    "C414",   # unnecessary list calls inside sets
    "C419",   # unnecessary list comprehensions
    "PLW0127",  # self-assignment
    "RUF015",   # prefer direct first-item iteration
    "SIM102",   # simplify nested conditionals
    "TRY201",   # preserve the active exception traceback
]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false


[tool.ty.src]
exclude = ["**/*.ipynb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "liesel_ptm/__about__.py"
