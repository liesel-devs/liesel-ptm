name: pre-commit

on:
  push:
    branches: [main, codex/cleanup]
  pull_request:
    branches: [main, codex/cleanup]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - name: Install package and development tools
        run: uv sync --locked --group dev
      - name: Run pre-commit
        run: uv run --locked pre-commit run -a
