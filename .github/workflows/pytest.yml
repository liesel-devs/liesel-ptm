name: pytest

on:
  push:
    branches: [main, codex/cleanup]
  pull_request:
    branches: [main, codex/cleanup]

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install package and development tools
        run: uv sync --locked --group dev
      - name: Run retained tests
        run: uv run --locked pytest -n 4 --dist loadscope -v --durations=20 --cov=liesel_ptm --cov-report=term-missing --cov-report=xml
      - name: Run plotting notebook
        run: uv run --locked pytest --nbval-lax --nbval-current-env --nbval-cell-timeout=120 demo/term-distribution-plots.ipynb
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
